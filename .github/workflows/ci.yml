name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check JavaScript syntax
        run: pnpm run check
      - name: Run tests
        run: pnpm test
      - name: Validate package boundary
        run: pnpm pack:check
      - name: Scan for credential prefixes
        shell: bash
        run: |
          set +e
          git grep -n -I -E '(^|[^[:alnum:]_])(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,})' -- .
          status=$?
          if [ "$status" -eq 0 ]; then
            echo 'Potential credential detected.' >&2
            exit 1
          elif [ "$status" -eq 1 ]; then
            echo 'No credential prefixes found.'
          else
            echo "Secret scan failed with git grep status $status." >&2
            exit "$status"
          fi
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Audit development graph (informational)
        continue-on-error: true
        run: pnpm audit --audit-level=high
